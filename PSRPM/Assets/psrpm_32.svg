<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bgGrad32" x1="12" y1="12" x2="244" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091326"/>
      <stop offset="60%" stop-color="#070c17"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="tachFlowGrad32" x1="50" y1="200" x2="200" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="30%" stop-color="#06b6d4"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="bladeTachGrad32" x1="60" y1="190" x2="190" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Squircle Tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad32)"/>
  <rect x="12" y="12" width="232" height="232" rx="52" stroke="url(#tachFlowGrad32)" stroke-width="6" opacity="0.9"/>

  <!-- 2. Vertically Centered Dial Assembly for 32px Windows Taskbar -->
  <g transform="translate(0, 13)">
    <!-- Bold Tachometer Perimeter Arc -->
    <path d="M 61.5 194.5 A 94 94 0 1 1 194.5 194.5" stroke="#1e293b" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M 61.5 194.5 A 94 94 0 1 1 194.5 194.5" stroke="url(#tachFlowGrad32)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 222 128 A 94 94 0 0 1 194.5 194.5" stroke="#ff0055" stroke-width="14" stroke-dasharray="10 6" stroke-linecap="round" fill="none"/>

    <!-- Scroll Housing Ring -->
    <circle cx="128" cy="128" r="74" stroke="#1e293b" stroke-width="6" fill="#080e1d"/>

    <!-- Impeller Blades -->
    <g stroke="url(#bladeTachGrad32)" stroke-width="9.5" stroke-linecap="round" fill="none">
      <path d="M 148 128 C 160 114 172 110 183 106"/>
      <path d="M 142 142 C 158 140 166 154 168 168"/>
      <path d="M 128 148 C 136 162 134 174 128 186"/>
      <path d="M 114 142 C 112 158 98 166 88 166"/>
      <path d="M 108 128 C 96 142 84 138 78 128"/>
      <path d="M 114 114 C 98 116 94 98 94 80"/>
      <path d="M 128 108 C 120 94 122 82 128 68"/>
      <path d="M 142 114 C 144 98 158 90 164 82"/>
    </g>

    <!-- Center Hub -->
    <circle cx="128" cy="128" r="26" fill="#0f172a" stroke="#94a3b8" stroke-width="5"/>
    <circle cx="128" cy="128" r="12" fill="#ffffff"/>
  </g>
</svg>