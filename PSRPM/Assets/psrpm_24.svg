<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bgGrad24" x1="12" y1="12" x2="244" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091326"/>
      <stop offset="60%" stop-color="#070c17"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="tachFlowGrad24" x1="50" y1="200" x2="200" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="30%" stop-color="#06b6d4"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="bladeTachGrad24" x1="60" y1="190" x2="190" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Squircle Tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad24)"/>
  <rect x="12" y="12" width="232" height="232" rx="52" stroke="url(#tachFlowGrad24)" stroke-width="8" opacity="0.9"/>

  <!-- 2. Vertically Centered Dial Assembly for 24px Micro Resolution -->
  <g transform="translate(0, 13)">
    <!-- Bold Tachometer Perimeter Arc -->
    <path d="M 61.5 194.5 A 94 94 0 1 1 194.5 194.5" stroke="#1e293b" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 61.5 194.5 A 94 94 0 1 1 194.5 194.5" stroke="url(#tachFlowGrad24)" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M 222 128 A 94 94 0 0 1 194.5 194.5" stroke="#ff0055" stroke-width="16" stroke-dasharray="12 8" stroke-linecap="round" fill="none"/>

    <!-- High-Contrast 6-Blade Pattern -->
    <g stroke="url(#bladeTachGrad24)" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M 152 128 C 166 112 178 108 190 106"/>
      <path d="M 138 148 C 148 166 142 180 134 190"/>
      <path d="M 112 144 C 104 162 90 168 78 168"/>
      <path d="M 104 128 C 90 114 78 118 66 128"/>
      <path d="M 118 108 C 108 90 114 76 122 66"/>
      <path d="M 144 112 C 152 94 166 88 178 88"/>
    </g>

    <!-- Center Hub -->
    <circle cx="128" cy="128" r="28" fill="#0f172a" stroke="#94a3b8" stroke-width="6"/>
    <circle cx="128" cy="128" r="13" fill="#ffffff"/>
  </g>
</svg>