<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Background Gradient: Deep Performance Obsidian -->
    <linearGradient id="bgGrad" x1="12" y1="12" x2="244" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091326"/>
      <stop offset="60%" stop-color="#070c17"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Continuous Low to High RPM Tachometer Gradient -->
    <linearGradient id="tachFlowGrad" x1="50" y1="200" x2="200" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>   <!-- 0 RPM (Cold Idle) -->
      <stop offset="30%" stop-color="#06b6d4"/>  <!-- 3,000 RPM (Cruise Spool) -->
      <stop offset="65%" stop-color="#f59e0b"/>  <!-- 6,000 RPM (Peak Torque) -->
      <stop offset="90%" stop-color="#ef4444"/>  <!-- 8,000 RPM (Redline Entry) -->
      <stop offset="100%" stop-color="#ff0055"/> <!-- 9,000+ RPM (Overboost Limiter) -->
    </linearGradient>

    <!-- Impeller Blades Spectrum Gradient -->
    <linearGradient id="bladeTachGrad" x1="60" y1="190" x2="190" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="tachGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="nutGrad" x1="128" y1="116" x2="128" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Squircle Tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="232" height="232" rx="52" stroke="url(#tachFlowGrad)" stroke-width="2.5" opacity="0.9"/>

  <!-- 2. Vertically Centered Dial & Impeller Assembly (Offset +13px for optical symmetry) -->
  <g transform="translate(0, 13)">
    <!-- Tachometer Perimeter Track & Scale (0k - 9k RPM) -->
    <path d="M 61.5 194.5 A 94 94 0 1 1 194.5 194.5" stroke="#1e293b" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 61.5 194.5 A 94 94 0 1 1 194.5 194.5" stroke="url(#tachFlowGrad)" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M 222 128 A 94 94 0 0 1 194.5 194.5" stroke="#ff0055" stroke-width="8" stroke-dasharray="7 4" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Key Tick Marks -->
    <line x1="56" y1="200" x2="68" y2="188" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="54" y1="54" x2="67" y2="67" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="128" y1="24" x2="128" y2="40" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="202" y1="54" x2="189" y2="67" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="232" y1="128" x2="216" y2="128" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="200" x2="188" y2="188" stroke="#ff0055" stroke-width="3" stroke-linecap="round"/>

    <!-- Turbo Compressor Volute Scroll Housing -->
    <path d="M 128 46 C 170 46 206 82 206 128 C 206 170 170 206 128 206 C 86 206 50 170 50 128 C 50 98 68 72 94 60 L 94 82 C 75 92 64 109 64 128 C 64 163 93 190 128 190 C 163 190 190 163 190 128 C 190 93 163 62 128 62 Z" fill="#0b1329" stroke="#334155" stroke-width="2" opacity="0.9"/>

    <!-- Compressor Inlet Ring -->
    <circle cx="128" cy="128" r="62" stroke="url(#tachFlowGrad)" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.8"/>

    <!-- Impeller Compressor Blades -->
    <g filter="url(#tachGlow)" stroke="url(#bladeTachGrad)" stroke-width="4.2" stroke-linecap="round" fill="none">
      <path d="M 148 128 C 160 114 172 110 183 106"/>
      <path d="M 142 142 C 158 140 166 154 168 168"/>
      <path d="M 128 148 C 136 162 134 174 128 186"/>
      <path d="M 114 142 C 112 158 98 166 88 166"/>
      <path d="M 108 128 C 96 142 84 138 78 128"/>
      <path d="M 114 114 C 98 116 94 98 94 80"/>
      <path d="M 128 108 C 120 94 122 82 128 68"/>
      <path d="M 142 114 C 144 98 158 90 164 82"/>
    </g>

    <!-- Secondary Splitter Blades -->
    <g stroke="url(#bladeTachGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M 154 114 C 168 104 180 102 188 94"/>
      <path d="M 146 150 C 158 158 164 170 162 180"/>
      <path d="M 114 154 C 120 168 118 180 110 188"/>
      <path d="M 102 146 C 94 158 82 164 72 162"/>
      <path d="M 102 114 C 88 124 76 126 68 134"/>
      <path d="M 110 102 C 98 94 92 82 94 72"/>
      <path d="M 142 102 C 136 88 138 76 146 68"/>
      <path d="M 154 110 C 162 98 174 92 184 94"/>
    </g>

    <!-- Central Hub & Spindle Nut -->
    <circle cx="128" cy="128" r="19" fill="#1e293b" stroke="#94a3b8" stroke-width="2.2"/>
    <circle cx="128" cy="128" r="11" fill="url(#nutGrad)"/>
    <circle cx="128" cy="128" r="4.5" fill="#38bdf8"/>
  </g>
</svg>